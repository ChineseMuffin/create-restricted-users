
---
- name: Configure restricted users
  hosts: raspberry_pi
  become: true

  tasks:
    - name: Create restricted user alice
      ansible.builtin.user:
        name: alice
        comment: Restricted lab user
        create_home: true
        shell: /bin/bash
        groups: []
        append: false
        state: present

    - name: Install SSH public key for alice
      ansible.posix.authorized_key:
        user: alice
        key: "{{ restricted_user_pubkey }}"
        state: present

    - name: Remove alice-specific sudoers file
      ansible.builtin.file:
        path: /etc/sudoers.d/alice
        state: absent

    - name: Ensure alice is not in the sudo group
      ansible.builtin.user:
        name: alice
        groups: []
        append: false
        state: present

    - name: Verify alice cannot escalate privileges without a password
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - alice
          - sudo
          - -n
          - id
      register: alice_sudo_test
      changed_when: false
      failed_when: alice_sudo_test.rc == 0

    - name: Create systemd slice drop-in directory
      ansible.builtin.file:
        path: /etc/systemd/system/user-1001.slice.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Configure resource limits for alice
      ansible.builtin.copy:
        dest: /etc/systemd/system/user-1001.slice.d/50-resource-limits.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          [Slice]
          CPUQuota=50%
          MemoryMax=512M
          TasksMax=100
      notify: Reload systemd

    - name: Enable memory cgroup in kernel command line
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^(?!.*cgroup_enable=memory)(.*)$'
        replace: '\1 cgroup_enable=memory'
      become: true
      notify: Reboot Raspberry Pi

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reboot Raspberry Pi
      ansible.builtin.reboot:
        reboot_timeout: 300
      become: true
