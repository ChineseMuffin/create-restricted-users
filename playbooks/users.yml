
---
- name: Configure restricted users
  hosts: raspberry_pi
  become: true

  tasks:
    - name: "Create restricted user {{ restricted_user }}"
      ansible.builtin.user:
        name: "{{ restricted_user }}"
        comment: Restricted lab user
        create_home: true
        shell: /bin/bash
        groups: []
        append: false
        state: present

    - name: "Install SSH public key for {{ restricted_user }}"
      ansible.posix.authorized_key:
        user: "{{ restricted_user }}"
        key: "{{ restricted_user_pubkey }}"
        state: present
      when: not ansible_check_mode

    - name: "Remove sudoers file for {{ restricted_user }}"
      ansible.builtin.file:
        path: "/etc/sudoers.d/{{ restricted_user }}"
        state: absent

    - name: "Ensure {{ restricted_user }} is not in the sudo group"
      ansible.builtin.user:
        name: "{{ restricted_user }}"
        groups: []
        append: false
        state: present

    - name: "Verify {{ restricted_user }} cannot escalate privileges without a password"
      ansible.builtin.command:
        argv:
          - sudo
          - -u
          - "{{ restricted_user }}"
          - sudo
          - -n
          - id
      register: restricted_user_sudo_test
      changed_when: false
      failed_when: restricted_user_sudo_test.rc == 0

    - name: "Get UID for {{ restricted_user }}"
      ansible.builtin.getent:
        database: passwd
        key: "{{ restricted_user }}"
        fail_key: "{{ not ansible_check_mode }}"

    - name: Create systemd slice drop-in directory
      ansible.builtin.file:
        path: "/etc/systemd/system/user-{{ ansible_facts.getent_passwd[restricted_user][1] }}.slice.d"
        state: directory
        owner: root
        group: root
        mode: "0755"
      when: ansible_facts.getent_passwd.get(restricted_user) is not none

    - name: "Configure resource limits for {{ restricted_user }}"
      ansible.builtin.copy:
        dest: "/etc/systemd/system/user-{{ ansible_facts.getent_passwd[restricted_user][1] }}.slice.d/50-resource-limits.conf"
        owner: root
        group: root
        mode: "0644"
        content: |
          [Slice]
          CPUQuota=50%
          MemoryMax=512M
          TasksMax=100
      notify: Reload systemd
      when: ansible_facts.getent_passwd.get(restricted_user) is not none

    - name: Enable memory cgroup in kernel command line
      ansible.builtin.replace:
        path: /boot/firmware/cmdline.txt
        regexp: '^(?!.*cgroup_enable=memory)(.*)$'
        replace: '\1 cgroup_enable=memory'
      become: true
      notify: Reboot Raspberry Pi

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd_service:
        daemon_reload: true

    - name: Reboot Raspberry Pi
      ansible.builtin.reboot:
        reboot_timeout: 300
      become: true
